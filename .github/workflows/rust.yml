name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose -- --nocapture
    - name: Run simple_test Example (Debug)
      run: cargo run --example simple_test
    - name: Final Release Build
      run: cargo build --release --verbose
    - name: Final Release Tests
      run: cargo test --release --verbose -- --nocapture
    - name: Run simple_test Example (Release)
      run: cargo run --release --example simple_test
